name: Update PHP packages

on:
  push:
    branches:
      - APM-6800-enable-automated-patches
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-packages:
    name: Update Composer lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer

      - name: Update PHP packages
        working-directory: user-restricted-separate-auth-tutorials/nhs-login/php
        run: composer update --no-interaction #NOSONAR

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 #v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          branch: APM-6800-update-php
          base: main
          delete-branch: true
          add-paths: |
            user-restricted-separate-auth-tutorials/nhs-login/php/composer.lock
          commit-message: "chore: update PHP packages"
          title: "chore: update PHP packages"
          body: "Updates PHP dependencies in user-restricted-separate-auth-tutorials/nhs-login/php/composer.lock."
          labels: dependencies, php, composer
